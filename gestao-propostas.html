<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#091253">
  <meta name="robots" content="noindex, nofollow">
  <title>Gestão de Propostas | City Park</title>
  <link rel="stylesheet" href="css/gestao-propostas.css?v=20260826-1">
  <link rel="stylesheet" href="css/admin-header.css?v=20260826-1">
  <link rel="icon" href="data:,">
  <style>html:not(.page-authorized) body { visibility: hidden; }</style>
</head>
<body>
  <header class="admin-header">
    <a class="admin-header-brand" href="painel-admin.html" aria-label="Início do Ambiente Administrativo"><img src="img/CityPark-Branco.png" alt="City Park"></a>
    <nav class="admin-header-actions" aria-label="Ações administrativas">
      <a class="admin-header-button admin-header-context" href="painel-admin.html">Voltar</a>
      <a class="admin-header-button" href="vendas.html">Tabela de Vendas</a>
      <button id="btnSairAdmin" class="admin-header-button" type="button">Sair</button>
    </nav>
  </header>
  <section class="figma-titlebar"><h1>Ambiente Administrativo</h1></section>

  <main class="proposal-management">
    <button id="refreshProposals" class="hidden-control" type="button">Atualizar</button>
    <div class="hidden-summary" aria-hidden="true"><span id="pendingCount">—</span><span id="approvedCount">—</span><span id="closedCount">—</span><span id="inactiveCount">—</span></div>
    <input id="proposalSearch" class="hidden-control" type="search">

    <section class="management-card">
      <div class="management-heading">
        <h2>Gestão de Propostas</h2>
        <label class="filter-icon" title="Filtrar propostas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/></svg>
          <select id="proposalStatusFilter" aria-label="Filtrar propostas por situação">
            <option value="pending">Aguardando análise</option><option value="approved">Aprovadas</option><option value="closed">Encerradas</option><option value="inactive">Inativas</option><option value="all">Todas as propostas</option>
          </select>
        </label>
      </div>

      <div id="proposalLoading" class="loading-state" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        Carregando propostas…
      </div>

      <div id="proposalTableWrap" class="table-wrap" hidden>
        <table class="proposal-table">
          <thead>
            <tr>
              <th>Proposta</th>
              <th>Corretor</th>
              <th>Unidade</th>
              <th>Imobiliária</th>
              <th>Situação</th>
              <th>Opções</th>
            </tr>
          </thead>
          <tbody id="proposalRows"></tbody>
        </table>
      </div>

      <div id="proposalEmpty" class="empty-state" hidden>
        <span aria-hidden="true">⌕</span>
        <h2>Nenhuma proposta encontrada</h2>
        <p>Ajuste o filtro ou a busca para visualizar outros registros.</p>
      </div>
    </section>
  </main>

  <div id="adminToast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/gestao-propostas.js?v=20260824-2"></script>
</body>
</html>
